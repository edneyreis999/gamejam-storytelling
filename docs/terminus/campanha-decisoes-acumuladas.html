<style>

*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:var(--body)/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1,h2,h3,p,figure{margin:0}h1,h2,h3{line-height:1.2}h1{font-size:var(--lead);letter-spacing:.08em}h2{font-size:var(--title);letter-spacing:-.025em;max-width:32ch}h3{font-size:var(--h3);margin-bottom:var(--s3)}p+p{margin-top:var(--s3)}a{color:var(--green);text-underline-offset:4px}a:hover{text-decoration-thickness:2px}button,select{font:inherit;min-height:44px;border:1px solid var(--strong);border-radius:var(--radius);background:var(--white);color:var(--ink);padding:var(--s2) var(--s3);max-width:100%;cursor:pointer}button:hover:not(:disabled){background:var(--green-soft)}button:active:not(:disabled){background:var(--sand)}button:disabled,select:disabled{color:var(--muted);background:var(--sand);cursor:default}button.primary{background:var(--green);color:var(--white)}button.primary:hover{background:var(--ink)}:focus-visible{outline:3px solid var(--focus);outline-offset:4px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}.skip{position:absolute;left:var(--s4);top:-100px;background:var(--white);padding:var(--s3);z-index:5}.skip:focus{top:var(--s4)}header{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:var(--s4) var(--s8);border-bottom:1px solid var(--line);flex-wrap:wrap}.meta,.caption{font-size:var(--small);color:var(--muted)}nav{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s8);border-bottom:1px solid var(--line);background:var(--white)}nav label{font-size:var(--small);font-weight:700}nav select{flex:1;min-width:0;max-width:680px}.counter{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:var(--small)}.slide{max-width:1504px;margin:auto;padding:var(--s8) var(--s12) var(--s12);min-height:calc(100vh - 150px)}.slide-head{display:flex;gap:var(--s8);justify-content:space-between;align-items:flex-end;margin-bottom:var(--s8)}.slide-head>p{max-width:42ch;color:var(--muted)}.eyebrow{text-transform:uppercase;font-size:var(--small);font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:var(--s3)}.lead{font-size:var(--lead);max-width:65ch}.columns{display:grid;grid-template-columns:1fr 1fr;gap:var(--s8)}.columns.three{grid-template-columns:repeat(3,minmax(0,1fr))}.columns>*{min-width:0}.pitch{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s16)}.pitch .lead{margin-bottom:var(--s6)}.note,.discussion{padding:var(--s4) var(--s6);background:var(--sand);margin-top:var(--s6)}.note strong,.discussion strong{display:block;margin-bottom:var(--s2)}.discussion{background:var(--blue-soft)}.discussion p{max-width:90ch}.tag{display:inline-block;font-size:var(--small);font-weight:700;padding:var(--s1) var(--s2);border:1px solid var(--strong);border-radius:var(--radius);margin-bottom:var(--s3)}.tag.confirmed{color:var(--green);background:var(--green-soft);border-color:var(--green)}.tag.proposed{color:var(--paid);background:var(--paid-soft);border-style:dashed;border-color:var(--paid)}.list{padding:0;margin:0;list-style:none}.list li{padding:var(--s4) 0;border-top:1px solid var(--line)}.list li strong{display:block;margin-bottom:var(--s1)}.list li p{color:var(--muted)}.journey{font-size:var(--small);color:var(--muted);padding-block:var(--s3);border-block:1px solid var(--line);margin-bottom:var(--s3)}.flow{position:relative;isolation:isolate;padding:var(--s4) var(--s2);display:flex;flex-direction:column;gap:var(--s8)}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1;overflow:visible}.edges path{fill:none;stroke:var(--strong);stroke-width:1.5}.edges path.optional{stroke:var(--blue);stroke-dasharray:5 4}.edges marker path{fill:var(--strong);stroke:none}.flow-row{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--s4);align-items:start}.node{background:var(--white);border:1px solid var(--strong);border-radius:var(--radius);padding:var(--s3);text-align:center;font-size:var(--small);min-width:0}.node strong{display:block}.node small{display:block;font-size:var(--small);color:var(--muted);margin-top:var(--s1)}.node.decision{background:var(--green-soft);border:2px solid var(--green)}.node.optional{border:2px dotted var(--blue);background:var(--blue-soft)}.node.paid{border:2px dashed var(--paid);background:var(--paid-soft)}.node.gate{background:var(--ink);color:var(--white)}.node.gate small{color:var(--white)}.node.end{border:2px solid var(--green)}.bridge{font-size:var(--small);font-weight:700;color:var(--green);padding-top:var(--s3)}.legend{display:flex;gap:var(--s3) var(--s6);flex-wrap:wrap;font-size:var(--small);margin-block:var(--s4)}.legend span{display:inline-flex;gap:var(--s2);align-items:center}.symbol{display:inline-block;width:20px;height:16px;border:1px solid var(--strong);background:var(--white)}.symbol.branch{border:2px solid var(--green);background:var(--green-soft)}.symbol.optional{border:2px dotted var(--blue);background:var(--blue-soft)}.symbol.paid{border:2px dashed var(--paid);background:var(--paid-soft)}.symbol.gate{background:var(--ink)}table{width:100%;border-collapse:collapse;font-size:var(--small)}caption{text-align:left;font-size:var(--body);font-weight:700;margin-bottom:var(--s3)}th{text-align:left;color:var(--muted);border-bottom:1px solid var(--strong)}th,td{padding:var(--s3);vertical-align:top}td{border-bottom:1px solid var(--line)}td:first-child{font-weight:700}td p+p{margin-top:var(--s2)}.table-wrap{overflow-x:auto}.block{margin-top:var(--s8)}.controls{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;padding:var(--s4) 0;border-block:1px solid var(--line);margin-block:var(--s4)}label.field{display:flex;flex-direction:column;gap:var(--s2);font-size:var(--small);font-weight:700;min-width:0}.controls label.field{flex:1;min-width:140px}.check{display:flex;align-items:center;gap:var(--s2);min-height:44px;font-size:var(--small)}.scenario-summary{padding:var(--s3) var(--s4);background:var(--green-soft);margin-block:var(--s4)}.recruit-row{border-top:1px solid var(--strong);padding-block:var(--s4);display:grid;grid-template-columns:1fr 3fr;gap:var(--s6)}.recruit-row h3{margin-bottom:var(--s2)}.recruit-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s4)}.recruit-controls label.field{font-weight:400}.recruit-controls select{width:100%}.recruit-status{grid-column:1/-1;font-size:var(--small);color:var(--muted)}.badge{display:inline-block;border-radius:var(--radius);padding:var(--s1) var(--s2);font-size:var(--small);font-weight:700;border:1px solid var(--strong)}.badge.open{color:var(--green);border-color:var(--green);background:var(--green-soft)}.badge.black{color:var(--white);background:var(--ink);border-color:var(--ink)}.badge.red{color:var(--red);background:var(--red-soft);border-color:var(--red)}.actions{display:flex;gap:var(--s3);flex-wrap:wrap;margin-block:var(--s4)}details{margin-top:var(--s6);border-block:1px solid var(--line);padding-block:var(--s2)}summary{cursor:pointer;font-weight:700;min-height:44px;padding-block:var(--s3)}details>div{padding-block:var(--s4)}.source{font-size:var(--small);color:var(--muted);margin-top:var(--s8)}.source a{display:inline-block;padding-block:var(--s2)}.cause-lane{display:grid;grid-template-columns:1fr 48px 1.25fr;align-items:center;gap:var(--s3);padding-block:var(--s4);border-bottom:1px solid var(--line)}.cause-lane .arrow{width:100%;height:32px;color:var(--strong)}.cause-lane .cause,.cause-lane .effect{border:1px solid var(--strong);border-radius:var(--radius);padding:var(--s4);background:var(--white)}.cause-lane .effect{background:var(--green-soft);border-color:var(--green)}.cause-lane strong{display:block}.cause-lane small{display:block;color:var(--muted);font-size:var(--small);margin-top:var(--s1)}.roster{list-style:none;padding:0;margin:var(--s4) 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3)}.roster li{padding:var(--s4);border:1px solid var(--strong);background:var(--white);border-radius:var(--radius)}.roster strong{display:block;font-size:var(--lead)}.roster small{display:block;margin-top:var(--s2);color:var(--muted)}.quote{font-size:var(--lead);padding-block:var(--s4);border-block:1px solid var(--line);margin-block:var(--s4)}.question-number{color:var(--blue);font-size:var(--small);font-weight:700}noscript{display:block;max-width:70ch;padding:var(--s8)}
@media(max-width:1000px){.slide{padding-inline:var(--s6)}.slide-head{display:block}.slide-head>p{margin-top:var(--s3);max-width:70ch}.columns.three{grid-template-columns:1fr}.columns.three .flow{max-width:700px;margin-inline:auto}.pitch{gap:var(--s8)}.recruit-row{grid-template-columns:1fr}.roster{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){:root{--title:2rem}header{padding:var(--s4)}nav{padding:var(--s3) var(--s4);flex-wrap:wrap;gap:var(--s2)}nav label{width:100%}nav select{flex-basis:calc(100% - 65px);max-width:none}nav button{flex:1}.counter{margin:0}.slide{padding:var(--s6) var(--s4) var(--s8)}.columns,.pitch{grid-template-columns:1fr;gap:var(--s6)}.recruit-controls{grid-template-columns:1fr}.roster{grid-template-columns:1fr 1fr}.cause-lane{grid-template-columns:1fr;gap:var(--s2)}.cause-lane .arrow{transform:rotate(90deg);width:32px;justify-self:center}.note,.discussion{padding:var(--s4)}table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}table.stack thead{display:none}table.stack tr{padding-block:var(--s3);border-top:1px solid var(--strong)}table.stack td{border:0;padding:var(--s2) 0}table.stack td[data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-weight:700}.flow-row{gap:var(--s2)}.node{padding:var(--s2)}.flow{padding-inline:0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{header,nav,.skip,.actions,.controls{display:none!important}.slide,.slide[hidden]{display:block!important;break-before:page;min-height:0;padding:12mm 0}.slide:first-child{break-before:auto}body{background:var(--white)}h2{font-size:24pt}.flow,.cause-lane,.recruit-row{break-inside:avoid}.columns.three{grid-template-columns:1fr}.table-wrap{overflow:visible}details>div{display:block!important}summary{display:none}.recruit-controls select{border:0}.source{font-size:10pt}}

<body>

<header><h1>TERMINUS</h1><span class="meta">Decisões que se acumulam · Em desenvolvimento</span></header>
<nav aria-label="Navegação da apresentação" hidden><label for="slide-index">Ir para</label><select id="slide-index"></select><span class="counter" id="counter" aria-live="polite"></span><button id="prev" type="button">← Anterior</button><button id="next" type="button">Próximo →</button></nav>
<main id="deck" tabindex="-1"></main>
<noscript>Ative JavaScript para explorar os diagramas e as simulações locais. Não é necessário acesso à internet. As decisões estão também na <a href="visao-do-jogo.md">visão do jogo</a>.</noscript>
<script>
const slides = [];
const graphs = new Map();
const tag = (text, proposed = false) => `<span class="tag ${proposed ? 'proposed' : 'confirmed'}">${text}</span>`;
const head = (number, title, description) => `<div class="slide-head"><div><p class="eyebrow">${number} / Decisões que se acumulam</p><h2>${title}</h2></div><p>${description}</p></div>`;
const discuss = (question, opinion, tradeoff) => `<aside class="discussion"><strong>Para discutir · ${question}</strong><p>${opinion}</p><p class="caption">${tradeoff}</p></aside>`;
const node = (id, label, detail = '', type = '') => ({id, label, detail, type});
const edge = (from, to, optional = false) => ({from, to, optional});
function flow(id, nodes, rows, edges, description) {
  graphs.set(id, {nodes, edges});
  return `<figure aria-label="${description}"><div class="flow" data-flow="${id}"><svg class="edges" aria-hidden="true"></svg>${rows.map(row => `<div class="flow-row" style="--cols:${row.length}">${row.map(key => {const n = nodes.find(n => n.id === key); return `<div class="node ${n.type}" data-node="${key}"><strong>${n.label}</strong>${n.detail ? `<small>${n.detail}</small>` : ''}</div>`;}).join('')}</div>`).join('')}</div><figcaption class="caption">${description}</figcaption></figure>`;
}
const legend = () => `<div class="legend"><span><i class="symbol" aria-hidden="true"></i>Etapa principal</span><span><i class="symbol branch" aria-hidden="true"></i>Decisão / compromisso</span><span><i class="symbol optional" aria-hidden="true"></i>Recrutamento opcional</span><span><i class="symbol paid" aria-hidden="true"></i>Intervenção com Ludos</span><span><i class="symbol gate" aria-hidden="true"></i>Ponto de não retorno</span></div>`;
function add(title, content) { slides.push({title, content}); }

add('O que escolhemos', head('01', 'As pessoas ficam. As escolhas também.', 'Uma campanha sobre fazer amigos e inimigos — e encontrar ambos do outro lado da arena.') + `<div class="pitch"><div>${tag('Estrutura confirmada')}<p class="lead">Ghork escolhe onde pertencer, com quem se aliar e quem levar consigo. O torneio reúne as pessoas que seguiram outros caminhos.</p><p>O recrutamento é a experiência esperada. A main quest apresenta oportunidades, mas não obriga o jogador a buscar aliados. A vantagem de +1 por herói ajuda; as cenas precisam fazer a companhia valer por si.</p><p class="quote">O destino competitivo é compartilhado. O significado de cada encontro depende do caminho até ele.</p></div><div><ul class="list"><li><strong>Três arcos</strong><p>Guilda → alianças X/Y → reencontros, chefão fixo e consequência pós-campeonato.</p></li><li><strong>Cinco recrutamentos opcionais</strong><p>Dez heróis possíveis; até cinco no grupo. Dois conflitos longos e três curtos.</p></li><li><strong>Rheed pode ser convencido</strong><p>Ludos deixam a criança pedir uma alteração no relato. A explicação pode ser improvável; o passado não desaparece.</p></li></ul></div></div><div class="note"><strong>Como ler esta apresentação</strong><p>“Confirmado” registra a entrevista. “Proposta para debate” marca matriz, cenas e interpretações ainda ajustáveis. Os gráficos usam funções e identificadores; não estabelecem nomes ou diálogos como cânone.</p></div><p class="source"><a href="visao-do-jogo.md">Visão do jogo</a></p>`);

add('Os três arcos', head('02', 'Uma trajetória, três mudanças de escala.', 'A Jornada do Herói orienta a transformação. Suas etapas não precisam coincidir com o início e o fim dos arcos.') + `<div class="columns three"><div><h3>1 · Pertencer</h3><p class="journey">Proposta de Jornada: mundo comum, chamado, recusa, mentor e travessia do limiar.</p>${flow('macro1',[node('start','Noite da História','Criança → relato de Rheed'),node('guilds','Conhecer três guildas','Q1 das três obrigatórias'),node('commit','Executar uma estratégia','Compromisso com uma guilda','decision'),node('join','Confronto resolvido','Duas guildas tornam-se hostis')],[['start'],['guilds'],['commit'],['join']],[edge('start','guilds'),edge('guilds','commit'),edge('commit','join')],'Arco 1: chegada, aproximação, compromisso e consequência.')}<p class="bridge">Fim do arco 1 → início do arco 2</p></div><div><h3>2 · Escolher aliados</h3><p class="journey">Proposta de Jornada: testes, aliados e inimigos; aproximação à prova maior.</p>${flow('macro2',[node('intro','Conhecer X e Y','Duas missões em ordem livre'),node('choice','Apoiar X ou Y','Pessoas e alianças','decision'),node('route','Concluir a rota','Duas missões exclusivas'),node('classify','Conquistar a classificação','Uma missão compartilhada','end')],[['intro'],['choice'],['route'],['classify']],[edge('intro','choice'),edge('choice','route'),edge('route','classify')],'Arco 2: conhecer ambos, assumir um lado e viver as consequências.')}<p class="bridge">Fim do arco 2 → início do arco 3</p></div><div><h3>3 · Reencontrar</h3><p class="journey">Proposta de Jornada: provação e recompensa no torneio; caminho de volta, ressurreição e retorno após a revelação.</p>${flow('macro3',[node('gate','Encerrar recrutamentos','Aviso + confirmação','gate'),node('matches','Quatro reencontros','Guildas, aliança preterida, não recrutados'),node('uv','Escolha curta U/V','Reconhecer o histórico','decision'),node('final','Final do torneio','Chefão fixo'),node('reveal','Revelação dos Ignotos'),node('boss','Confronto pós-campeonato','Outro chefão obrigatório'),node('end','Encerramento','','end')],[['gate'],['matches'],['uv'],['final'],['reveal'],['boss'],['end']],[edge('gate','matches'),edge('matches','uv'),edge('uv','final'),edge('final','reveal'),edge('reveal','boss'),edge('boss','end')],'Arco 3: o torneio termina antes do confronto final da campanha.')}</div></div>${legend()}<p class="caption">As setas indicam progressão; não duração. Os cinco recrutamentos ficam fora do caminho obrigatório. A associação à Jornada é flexível e proposta, não uma exigência de doze capítulos.</p>`);

add('Arco 1 — compromisso', head('03', 'Antes da bandeira, conhecer as pessoas.', 'As três guildas oferecem aproximação. R1 e R2 apresentam relações que o jogador poderá retomar quando tiver uma guilda.') + `<div class="columns"><div>${tag('Regras confirmadas')}${flow('arc1',[node('explore','Explorar as sequências das guildas','Q1 → Q2 → Q3 → Q4; pode intercalar o avanço'),node('offers','Ouvir propostas elegíveis','Q4 da guilda libera sua oferta de Q5'),node('execute','Confirmar e executar uma estratégia','Exige Q1 das três + Q4 da escolhida','decision'),node('conflict','Resolver o confronto de Q5','Uma guilda aliada; duas hostis','end')],[['explore'],['offers'],['execute'],['conflict']],[edge('explore','offers'),edge('offers','execute'),edge('execute','conflict')],'O compromisso exige Q1 das três guildas e Q4 da escolhida. Há quinze missões de guilda possíveis; sete a treze concluídas por partida.')}</div><div><h3>Ao lado da main quest</h3>${flow('early',[node('meet','Conhecer R1 e R2','Oportunidades opcionais','optional'),node('solve','Resolver um conflito','Registrar o desfecho A ou B','optional'),node('reward','Receber Ludos uma vez','A recompensa não espera o convite','optional'),node('invite','Retomar na entrada do arco 2','Verificar afinidade com a guilda','optional')],[['meet'],['solve'],['reward'],['invite']],[edge('meet','solve',true),edge('solve','reward',true),edge('reward','invite',true)],'Resolver o problema não obriga nem antecipa o recrutamento.')}<div class="note">${tag('Proposta para debate',true)}<strong>Ludos no arco 1 · uma conversa improvável</strong><p>A criança pede para ouvir alguém que se recusaria a falar. Rheed inventa uma coincidência que abre o diálogo. A cena revela uma perspectiva extra; as apresentações e o compromisso continuam necessários.</p><p class="caption">Sem Ludos: Ghork prossegue com as informações gratuitas. A fonte do primeiro saldo pode ser um conflito opcional já resolvido ou uma secundária, fora deste gráfico.</p></div></div>${discuss('O jogador percebe as guildas antes de escolhê-las?','Minha sugestão: cada apresentação demonstra uma atitude concreta, em vez de apenas anunciar valores. As pessoas atendidas por Ghork podem discordar da instituição que ele escolhe.','O compromisso deve avisar sobre a hostilidade. Os motivos individuais dos futuros recrutas podem ser descobertos em conversa; não precisamos revelar toda a matriz de antemão.')}`);

add('Arco 2 — alianças X/Y', head('04', 'Conhecer os dois lados. Viver um deles.', 'X/Y são grupos ou pessoas a apoiar, dentro da trajetória da guilda. As duas rotas chegam à classificação, preservando a aliança escolhida.') + `<div class="columns"><div>${flow('arc2',[node('entry','Entrada no arco 2','R1/R2 podem recrutar'),node('ix','Apresentação X','Missão curta'),node('iy','Apresentação Y','Missão curta'),node('commit','Escolher a aliança X ou Y','Concluir ambas as apresentações','decision'),node('x1','X · missão 1','Primeiro compromisso'),node('y1','Y · missão 1','Primeiro compromisso'),node('x2','X · missão 2','Resolver o conflito'),node('y2','Y · missão 2','Resolver o conflito'),node('join','Rotas convergem','Liberar R3/R4; guardar X/Y'),node('qualification','Missão compartilhada','Classificação → liberar R5','end')],[['entry'],['ix','iy'],['commit'],['x1','y1'],['x2','y2'],['join'],['qualification']],[edge('entry','ix'),edge('entry','iy'),edge('ix','commit'),edge('iy','commit'),edge('commit','x1'),edge('commit','y1'),edge('x1','x2'),edge('y1','y2'),edge('x2','join'),edge('y2','join'),edge('join','qualification')],'As apresentações são ambas obrigatórias, em ordem livre. Depois do compromisso, apenas uma sequência exclusiva é jogada.')}</div><div>${tag('5 missões jogadas · 7 escritas')}<ul class="list"><li><strong>As apresentações não são duas rotas ainda</strong><p>O jogador conhece as necessidades dos dois grupos antes de assumir um lado. A guilda muda reações, não duplica a estrutura.</p></li><li><strong>As missões exclusivas precisam cobrar algo</strong><p>Uma promessa exige uma escolha concreta. A segunda missão mostra quem teve de arcar com o custo — inclusive dentro do grupo apoiado.</p></li><li><strong>O grupo preterido continua agindo</strong><p>Ele constrói seu próprio caminho e reaparece nas quartas. Não precisa virar vilão por ter sido deixado para trás.</p></li></ul><div class="note">${tag('Proposta para debate',true)}<strong>Uma relação que resiste ao apoio</strong><p>Uma pessoa do grupo escolhido discorda do método de Ghork; alguém do outro lado reconhece sua palavra. Assim, X/Y não divide o elenco entre quem gosta e quem odeia o protagonista.</p></div><p class="caption block">A proposta é usar Ludos para uma abordagem local, sem pular apresentações nem resolver o conflito automaticamente.</p></div></div>${discuss('O que sustenta cada aliança?','Minha sugestão: dar a ambos os grupos um pedido compreensível e uma concessão difícil. O primeiro conflito pode revelar uma promessa incompatível com outra, sem estabelecer uma resposta moral universal.','Os nomes, pedidos e concessões ainda serão escritos. A estrutura não exige que X seja mais bondoso, mais fácil ou mais rentável que Y.')}`);

add('Recrutamento — os momentos', head('05', 'Resolver primeiro. Convidar quando fizer sentido.', 'As missões opcionais acompanham a campanha. Somente os recrutamentos que dependem de X/Y precisam esperar a resolução dessa rota.') + `<table class="stack"><caption>Liberação em 2 + 2 + 1</caption><thead><tr><th>Par</th><th>Quando aparece</th><th>Quando pode recrutar</th><th>O que fica registrado</th></tr></thead><tbody><tr><td>R1 · curta<br>R2 · longa</td><td data-label="Conflito">Arco 1. Pode conhecer e resolver antes de ter guilda.</td><td data-label="Convite">Entrada no arco 2, conforme a guilda e o desfecho.</td><td data-label="Memória">Quem foi favorecido; recompensa já recebida; convite ainda pendente.</td></tr><tr><td>R3 · curta<br>R4 · longa</td><td data-label="Conflito">Depois das duas missões exclusivas de X/Y.</td><td data-label="Convite">Desde a liberação, após resolver o conflito e satisfazer o acesso.</td><td data-label="Memória">Guilda + X/Y determinam a restrição proposta.</td></tr><tr><td>R5 · curta</td><td data-label="Conflito">Ao conquistar a classificação.</td><td data-label="Convite">Antes de confirmar a entrada nas eliminatórias.</td><td data-label="Memória">Última oportunidade; não exige outro recrutamento.</td></tr></tbody></table><p class="caption block">R2 e R4 como missões longas é uma distribuição proposta. Os cinco pares têm heróis próprios; “A” e “B” não são as mesmas duas pessoas em todo o jogo.</p><div class="columns block"><div>${flow('recruit-life',[node('available','Conflito disponível','','optional'),node('resolved','Desfecho A ou B','Recompensa única em Ludos','optional'),node('eligible','Convite elegível?','Guilda / rota / intervenção','decision'),node('recruited','Recrutar o herói favorecido','Ou deixar o convite pendente','optional')],[['available'],['resolved'],['eligible'],['recruited']],[edge('available','resolved',true),edge('resolved','eligible',true),edge('eligible','recruited',true)],'O convite preserva o desfecho; pagar não concede os dois integrantes.')}</div><div><h3>Aviso antes das eliminatórias</h3><p>R5 não deve abrir e fechar na mesma cena. Depois da classificação, o jogador volta à exploração e decide quando iniciar a reta final.</p><p>O aviso lista pendências e explica que avançar encerra os recrutamentos. Rejeitar o avanço mantém as missões abertas. Confirmar preserva o grupo formado e segue para as cinco partidas.</p><p class="note"><strong>Não é um prazo escondido</strong>As missões abertas ficam disponíveis até essa confirmação. Uma oportunidade específica de diálogo pago pode passar se o jogador encerrar aquela cena sem escolhê-la.</p></div></div>${discuss('A missão longa R4 terá espaço para respirar?','Minha sugestão: permitir pausas entre suas cenas e voltar à main quest. A classificação não deve iniciar as eliminatórias automaticamente.','Quantidade igual de bloqueios não mede tempo de convivência. Vamos comparar especialmente os percursos em que uma missão longa fica vermelha.')}`);

const recruits = [
  {id:'R1',length:'Curta',stage:1,when:'Entrada no arco 2'},
  {id:'R2',length:'Longa',stage:1,when:'Entrada no arco 2'},
  {id:'R3',length:'Curta',stage:2,when:'Conflito X/Y resolvido'},
  {id:'R4',length:'Longa',stage:2,when:'Conflito X/Y resolvido'},
  {id:'R5',length:'Curta',stage:3,when:'Classificação conquistada'}
];
// O = aberto; PA/PB = preto com A/B bloqueado; R = vermelho. Matriz proposta, não cânone.
const accessMatrix = {
  AX:['O','PA','R','PB','O'], AY:['O','PA','O','R','PB'],
  BX:['PB','O','PA','O','R'], BY:['PB','O','R','PA','O'],
  CX:['O','PB','O','R','PA'], CY:['O','PB','PB','O','R']
};
function accessBadge(code) {
  if (code === 'O') return '<span class="badge open">○ Aberto · A ou B</span>';
  if (code === 'R') return '<span class="badge red">× Vermelho · missão fechada</span>';
  return `<span class="badge black">◐ Preto · ${code[1]} exige Ludos</span>`;
}
const matrixMarkup = Object.entries(accessMatrix).map(([key,codes]) => `<tr><td>${key[0]} + ${key[1]}</td>${codes.map(code=>`<td>${code==='O'?'Aberto':code==='R'?'Vermelho':'Preto · '+code[1]+' fechado'}</td>`).join('')}</tr>`).join('');
add('Simular recrutamentos', head('06', 'A mesma quantidade. Outras pessoas.', 'Proposta de matriz: dois abertos, dois pretos e um vermelho em todas as seis combinações. A cor descreve o acesso-base, antes de gastar Ludos.') + `${tag('Matriz para debate',true)}<div class="controls" id="scenario-controls"><label class="field">Guilda<select id="guild"><option>A</option><option>B</option><option>C</option></select></label><label class="field">Aliança<select id="route"><option value="X">X</option><option value="Y">Y</option></select></label><label class="field">Momento observado<select id="phase"><option value="1">Entrada no arco 2</option><option value="2">X/Y resolvido</option><option value="3" selected>Após a classificação</option><option value="4">Recrutamentos encerrados</option></select></label></div><p class="caption">Comparador de cenários, sem saldo ou preços. Trocar guilda ou rota inicia outra simulação: limpa os desfechos, as intervenções e os recrutamentos. Na entrada do arco 2, X/Y serve apenas para projetar os acessos futuros.</p><p id="scenario-status" class="scenario-summary" role="status"></p><div id="recruit-editor">${recruits.map((r,i)=>`<section class="recruit-row" aria-labelledby="title-${r.id}"><div><h3 id="title-${r.id}">${r.id} · ${r.length.toLowerCase()}</h3><p id="badge-${i}"></p><p class="caption">${r.when}</p></div><div class="recruit-controls"><label class="field" for="history-${i}">Desfecho do conflito<select id="history-${i}" data-history="${i}"><option value="none">Não resolvido</option><option value="A">Favoreceu A</option><option value="B">Favoreceu B</option></select></label><label class="field" for="paid-${i}">Intervenção de Rheed<span class="check"><input id="paid-${i}" data-paid="${i}" type="checkbox"> Usar Ludos</span></label><label class="field" for="hero-${i}">Aliado no grupo<select id="hero-${i}" data-hero="${i}" aria-describedby="reason-${i}"><option value="none">Nenhum</option><option value="A">Herói A</option><option value="B">Herói B</option></select></label><p id="reason-${i}" class="recruit-status"></p></div></section>`).join('')}</div><div class="actions"><button type="button" id="free-team">Montar grupo gratuito</button><button type="button" id="clear-team">Limpar simulação</button><button type="button" data-jump="10">Ver adversários →</button></div><p class="caption">“Montar grupo gratuito” cria desfechos compatíveis para os recrutamentos já liberados. É uma comparação de possibilidades, não uma forma de desfazer decisões no jogo. Depois do fechamento, volte a um momento anterior para editar o cenário.</p><details><summary>Comparar as seis trajetórias</summary><div class="table-wrap"><table><caption>Matriz-base proposta · PA/PB indicam qual herói exige Ludos</caption><thead><tr><th>Guilda + rota</th>${recruits.map(r=>`<th>${r.id}</th>`).join('')}</tr></thead><tbody>${matrixMarkup}</tbody></table></div></details>${discuss('Quatro missões acessíveis garantem quatro aliados gratuitos?','Não em todo histórico. Se você favoreceu A e depois seu convite ficou preto para A, a alternativa B gratuita não apaga o desfecho. Será preciso liberar A com Ludos ou deixar esse par sem recruta.','É uma consequência que combina com a proposta. Precisamos sinalizar afinidades e fazer a criança entender a intervenção, para o bloqueio não parecer um erro do jogo.')}`);

add('Conflito resolvido ou ainda fechado', head('07', 'O mesmo bloqueio encontra dois passados.', 'Exemplo mecânico do roubo, ainda não aprovado como missão. Aqui exploramos um recrutamento vermelho; não é uma atribuição definitiva a R2 na matriz anterior.') + `<div class="columns"><div><h3>Ghork já ajudou no arco 1</h3>${flow('robbery-done',[node('action','Recuperou os itens com violência','A foi favorecido'),node('reward','Recebeu a recompensa','Uma única vez'),node('refusal','A recusa a guilda escolhida','O convite está fechado'),node('pay','A criança intervém com Ludos','Rheed inventa uma exceção','paid'),node('ally','A pode ser recrutado','Sem repetir missão ou recompensa','optional')],[['action'],['reward'],['refusal'],['pay'],['ally']],[edge('action','reward'),edge('reward','refusal'),edge('refusal','pay',true),edge('pay','ally',true)],'Sem intervenção, o convite permanece fechado. O conflito anterior continua resolvido.')}</div><div><h3>Ghork ainda não ajudou</h3>${flow('robbery-new',[node('closed','A missão está vermelha','Não foi realizada antes do bloqueio'),node('pay','A criança intervém com Ludos','Liberar a missão inteira','paid'),node('resolve','Ghork resolve o conflito','O desfecho favorece A ou B'),node('reward','Recebe a recompensa','Pela primeira e única vez'),node('ally','Recrutamento conforme o desfecho','Sem cobrar outro desbloqueio','optional')],[['closed'],['pay'],['resolve'],['reward'],['ally']],[edge('closed','pay',true),edge('pay','resolve',true),edge('resolve','reward'),edge('reward','ally',true)],'O pagamento abre a possibilidade. O jogador ainda precisa resolver o conflito.')}</div></div><div class="note">${tag('Tom sugerido, não diálogo final',true)}<p class="quote">Criança: “Mas ele pode mudar de ideia!”<br>Rheed: “Pode… porque o estatuto tinha uma cláusula escrita no verso. Ninguém olha o verso.”</p><p>A explicação inventada abre o convite. Não muda o que Ghork fez aos ladrões nem como o outro herói se sentiu.</p></div>${discuss('Quanto deve custar a exceção?','Minha sugestão: liberar apenas o convite custa menos do que abrir toda a missão. Isso reconhece quem já resolveu o conflito.','Sem valores por enquanto. Se a recompensa devolver sempre todo o custo, o gasto pode virar uma escolha automática. Receber Ludos na conclusão também não significa poder pagar antecipadamente sem outra fonte de saldo.')}`);

add('Ludos nos três arcos', head('08', 'A criança pede. Rheed dá um jeito.', 'Intervenções específicas ampliam o relato. Não compram uma nova campanha nem eliminam todas as consequências.') + `<table class="stack"><caption>Propostas de uso — todas mantêm um caminho gratuito</caption><thead><tr><th>Onde</th><th>Sem Ludos</th><th>Pedido da criança</th><th>O que continua valendo</th></tr></thead><tbody><tr><td>Arco 1<br>Antes do compromisso</td><td data-label="Gratuito">Ouvir as apresentações e agir com a informação disponível.</td><td data-label="Intervenção">“E se ele conseguisse falar com aquela pessoa?” Uma coincidência abre um depoimento extra.</td><td data-label="Limite">Não pula Q1–Q4 nem desfaz a escolha da guilda. A informação adicional não é necessária para entender o conflito.</td></tr><tr><td>Arco 2<br>Alianças e convites</td><td data-label="Gratuito">Concluir X/Y e recrutar conforme os acessos e desfechos disponíveis.</td><td data-label="Intervenção">Abrir missão ou convite restrito. Numa cena da rota, permitir que alguém escute a explicação de Ghork.</td><td data-label="Limite">Não troca X por Y, não concede ambos os heróis e não apaga os prejudicados.</td></tr><tr><td>Arco 3<br>Antes de um reencontro</td><td data-label="Gratuito">Entrar na partida com a tensão deixada pelo passado.</td><td data-label="Intervenção">“Eles não podiam conversar antes?” Rheed inventa um encontro que permite esclarecer um gesto ou cumprir uma pequena promessa.</td><td data-label="Limite">O adversário continua o mesmo; há partida e vitória a conquistar. Nenhum recrutamento é reaberto.</td></tr></tbody></table><div class="columns block"><div><h3>O humor pertence ao narrador</h3><p>A explicação pode ser absurda, mas o personagem não precisa virar uma piada. Depois da intervenção, ele ainda lembra o que aconteceu e pode aceitar uma exceção com ressalvas.</p><p>As improvisações serão escritas como variantes de diálogo. Não exigem geração de texto durante o jogo.</p></div><div><h3>Outros usos disputam a moeda</h3><p>As cargas de nova rolagem continuam disponíveis no Coreto. Gastar num diálogo pode significar guardar menos recursos para uma batalha.</p><p>Secundárias e conflitos de recrutamento podem fornecer Ludos. As secundárias não entram nos fluxogramas desta apresentação.</p></div></div>${discuss('Pagar pode ser sempre a melhor resposta?','Minha sugestão: a opção paga oferece uma possibilidade expressiva, não uma resposta moral superior. Uma conversa extra pode revelar uma discordância, não necessariamente eliminá-la.','Antes de definir preços, precisamos escolher o que cada intervenção acrescenta. O gasto nunca garante vitória, substitui a escolha U/V ou altera a identidade do chefão fixo.')}`);

const arrow = '<svg class="arrow" viewBox="0 0 48 32" aria-hidden="true"><path d="M2 16H42M32 6L42 16L32 26" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
add('Diagrama — as escolhas voltam', head('09', 'O arco 3 é feito de reencontros.', 'Cada linha mostra a origem de uma consequência e a partida em que ela ganha presença. A simulação do slide 6 atualiza os participantes.') + `<p class="scenario-summary" id="echo-status"></p><div id="echo-lanes"></div><p class="caption block">Na simulação, as guildas não escolhidas aparecem em ordem alfabética somente para comparar os cenários. A ordem dramática das duas primeiras partidas ainda será definida.</p><div class="actions"><button type="button" data-jump="6">Alterar trajetória</button><button type="button" data-jump="10">Examinar a semifinal →</button></div>${discuss('Tudo precisa voltar como acusação?','Não. Minha sugestão é variar o reencontro: uma guilda cobra uma promessa, o grupo preterido demonstra autonomia e um herói agradece pela ajuda antes de tentar vencer Ghork.','As decisões principais definem esses encontros. Pequenas escolhas reaparecem em falas, informações e condições locais, sem multiplicar a quantidade de partidas.')}`);

add('As cinco partidas', head('10', 'Cinco adversários. Um destino preparado.', 'As primeiras quatro partidas carregam o histórico. A quinta concentra o conflito com o chefão fixo do torneio.') + `<table class="stack"><caption id="matches-caption">Sequência da reta final</caption><thead><tr><th>Partida</th><th>Quem enfrenta Ghork</th><th>O que a cena deve reconhecer</th></tr></thead><tbody id="matches"></tbody></table><div class="block"><h3>Semifinal · um representante de cada par</h3><p id="roster-status" role="status"></p><ol id="roster" class="roster"></ol><div class="actions"><button type="button" id="reroll">Refazer sorteio dos pares sem aliado</button><button type="button" data-jump="6">Editar recrutamentos</button></div><p class="caption">O sorteio fica estável ao navegar pelos slides. No comparador, o botão permite testar outra composição; não é uma compra com Ludos nem uma regra de rerrolagem do torneio. Quem já foi recrutado nunca entra no time adversário.</p></div><div class="columns block"><div><h3>Rivais, não cinco cópias de ressentimento</h3><p>Um herói pode competir com respeito, outro com mágoa e outro sem sequer conhecer Ghork. O motivo do reencontro depende do conflito anterior, não apenas de estar fora do grupo.</p></div><div><h3>O número de adversários não define a dificuldade</h3><p>Os cinco membros da semifinal são composição narrativa. A dificuldade do D20 continua uma decisão própria. Ter +0 precisa permitir vitória e revanche, mas a experiência esperada inclui aliados.</p></div></div><div class="note"><strong>Depois do chefão do torneio</strong><p>Vitória → revelação dos Ignotos → confronto obrigatório pós-campeonato → encerramento. O chefão do torneio e o chefão posterior não são fundidos. A relação concreta entre campeonato e selo continua em aberto.</p></div>`);

add('U/V e preparação do chefão', head('11', 'A última escolha encontra o que ficou para trás.', 'U/V é um desvio curto antes da final. O chefão é o mesmo; a forma de Ghork chegar até ele pode reconhecer sua trajetória.') + `<div class="columns"><div>${tag('Função de U/V proposta para debate',true)}${flow('uv',[node('semi','Semifinal concluída','Ghork reencontrou os não recrutados'),node('decision','Como preparar a resposta final?','As duas opções são gratuitas','decision'),node('u','U · sustentar os compromissos','Preparar com a aliança atual'),node('v','V · buscar entendimento pontual','Conversar com o grupo preterido'),node('final','Final contra o chefão fixo','Convergência; conservar guilda + X/Y + U/V','end')],[['semi'],['decision'],['u','v'],['final']],[edge('semi','decision'),edge('decision','u'),edge('decision','v'),edge('u','final'),edge('v','final')],'U/V muda a preparação e o reconhecimento das relações, não a identidade do adversário nem a obrigação de disputar a final.')}</div><div><h3>Preparar o chefão desde o início</h3><ul class="list"><li><strong>Arco 1 · presença</strong><p>Uma referência concreta à influência do campeão permite que o jogador forme uma expectativa, sem revelar o conflito inteiro.</p></li><li><strong>Arco 2 · efeito sobre pessoas</strong><p>X e Y vivem consequências diferentes dessa influência. A ameaça cresce por seus efeitos, não apenas por elogios ao poder do chefe.</p></li><li><strong>Arco 3 · confronto</strong><p>Antes da final, retomar algo já mostrado. O jogador entende o que está enfrentando além de uma dificuldade maior no dado.</p></li></ul><p class="caption block">São funções de cena propostas. Não definem identidade, poderes ou ligação do campeão com os Ignotos.</p></div></div>${discuss('V apaga a consequência de escolher X/Y?','Não deveria. Minha sugestão é permitir um entendimento limitado: reconhecer uma dívida, ouvir uma crítica ou combinar algo pontual. Não trocar de lado nem converter as guildas hostis em aliadas.','U também precisa ter valor: cumprir uma promessa ou proteger uma confiança construída. Se apenas V oferecer uma cena rica, a escolha vira uma preferência óbvia pelo conteúdo maior.')}`);

add('Pontos para a próxima conversa', head('12', 'O que ainda precisa ganhar peso.', 'A estrutura está escolhida. As próximas decisões devem melhorar as relações e o ritmo, sem multiplicar campanhas.') + `<div class="columns"><div><span class="question-number">01 · AS ALIANÇAS</span><h3>O que X e Y pedem a Ghork?</h3><p>Minha recomendação: dois pedidos compreensíveis que não possam ser atendidos integralmente ao mesmo tempo. Evitar uma rota generosa e outra simplesmente cruel.</p><p class="caption">Decisão seguinte: escolher os grupos e a incompatibilidade concreta.</p><div class="block"><span class="question-number">02 · AS MISSÕES LONGAS</span><h3>Quem perde mais conteúdo?</h3><p>Bloquear R4 longa pode custar mais cenas que bloquear R5 curta. A matriz iguala quantidades, não tempo, vínculo ou interesse.</p><p class="caption">Decisão seguinte: comparar o conteúdo que continua gratuito em cada trajetória antes de fixar a matriz.</p></div><div class="block"><span class="question-number">03 · A MOEDA</span><h3>A intervenção continua sendo uma escolha?</h3><p>Convite já preparado deveria custar menos que missão inteira. Nenhuma recompensa se repete, e a moeda também disputa espaço com novas rolagens.</p><p class="caption">Decisão seguinte: definir efeitos antes de calcular custos, recompensas e frequência.</p></div></div><div><span class="question-number">04 · OS REENCONTROS</span><h3>Qual reação surpreende sem contradizer?</h3><p>Uma pessoa deixada para trás pode prosperar. Um aliado pode discordar. Competir contra Ghork não exige que todos o odeiem.</p><p class="caption">Decisão seguinte: dar a cada partida uma emoção dominante diferente.</p><div class="block"><span class="question-number">05 · A ESCOLHA U/V</span><h3>Manter a palavra ou tentar um entendimento?</h3><p>A proposta compara compromissos atuais e relações preteridas. As duas precisam entregar uma cena própria e uma consequência reconhecível na final.</p><p class="caption">Decisão seguinte: aceitar essa função ou substituí-la antes de escrever as cenas.</p></div><div class="block"><span class="question-number">06 · OS DOIS CONFRONTOS</span><h3>O que a vitória resolve — e o que revela?</h3><p>Preparar o chefe do torneio cedo; reservar o confronto posterior para a ameaça dos Ignotos. O primeiro precisa ter encerramento próprio.</p><p class="caption">Decisão seguinte: identidade de cada chefão e ligação entre torneio e selo, ainda em aberto.</p></div></div></div><div class="note"><strong>Minha recomendação para a próxima rodada</strong><p>Escolher primeiro as pessoas de X/Y e o pedido incompatível. Isso dá matéria para escrever as duas rotas, a partida das quartas e o retorno dessa relação em U/V. Depois, distribuir os cinco pares de heróis ao redor desses conflitos.</p></div><p class="source"><a href="visao-do-jogo.md">Decisões registradas na visão do jogo</a> · <a href="../docs_externas/punch-club/punch-club-quests.html">Referência estrutural: Punch Club</a> · <a href="../docs_externas/punch-club/punch-club-2-quests.html">Referência estrutural: Punch Club 2</a><br>As referências externas orientam bifurcações e convergências; não são documentação aprovada de Terminus. Esta apresentação compara possibilidades e não salva decisões de roteiro.</p>`);

const state = {guild:'A', route:'X', phase:3, history:Array(5).fill('none'), paid:Array(5).fill(false), heroes:Array(5).fill('none'), draw:Array.from({length:5},()=>Math.random()<.5?'A':'B')};
function getCodes() { return accessMatrix[state.guild + state.route]; }
function allowedHero(i, hero) {
  const code = getCodes()[i];
  return recruits[i].stage <= state.phase && state.history[i] === hero && (state.paid[i] || code === 'O' || (code.startsWith('P') && code[1] !== hero));
}
function opponents() { return state.heroes.map((hero,i) => hero === 'none' ? state.draw[i] : hero === 'A' ? 'B' : 'A'); }
function resetScenario() { state.history.fill('none'); state.paid.fill(false); state.heroes.fill('none'); }
function renderScenario() {
  const codes = getCodes(), closed = state.phase === 4;
  recruits.forEach((r,i) => {
    const available = r.stage <= state.phase;
    const history = document.getElementById('history-'+i), paid = document.getElementById('paid-'+i), hero = document.getElementById('hero-'+i);
    if (!available) { state.history[i]='none'; state.paid[i]=false; state.heroes[i]='none'; }
    if (state.heroes[i] !== 'none' && !allowedHero(i,state.heroes[i])) state.heroes[i]='none';
    document.getElementById('badge-'+i).innerHTML = accessBadge(codes[i]);
    history.value=state.history[i];
    history.disabled=closed || !available || (codes[i]==='R' && !state.paid[i]);
    paid.checked=state.paid[i]; paid.disabled=closed || !available || codes[i]==='O';
    hero.value=state.heroes[i]; hero.disabled=closed || !available;
    for (const option of hero.options) option.disabled=option.value!=='none' && !allowedHero(i,option.value);
    const reward = state.history[i]==='none' ? 'Recompensa ainda não recebida.' : 'Conflito resolvido; recompensa recebida uma vez. O convite não a repete.';
    let reason;
    if (!available) reason='Ainda não liberado neste momento. '+r.when+'.';
    else if (closed) reason='Janela encerrada. '+(state.heroes[i]==='none'?'Nenhum integrante foi recrutado.':'Herói '+state.heroes[i]+' permanece no grupo.');
    else if (codes[i]==='R' && !state.paid[i]) reason=state.history[i]==='none' ? 'Missão fechada nesta trajetória. Use Ludos para abrir a missão inteira; sem intervenção, a campanha continua.' : 'Conflito já resolvido; somente o convite está fechado. Uma intervenção libera o herói favorecido, sem repetir a recompensa.';
    else if (state.history[i]==='none') reason='Escolha um desfecho para representar a resolução do conflito. Depois, o convite respeitará esse resultado.';
    else if (!allowedHero(i,state.history[i])) reason='O herói '+state.history[i]+' foi favorecido, mas seu convite exige Ludos. O outro herói não substitui esse desfecho.';
    else reason='O herói '+state.history[i]+' pode ser recrutado. A intervenção, quando usada, não concede o outro integrante.';
    document.getElementById('reason-'+i).textContent=reason+' '+(available?reward:'');
  });
  const count=state.heroes.filter(h=>h!=='none').length, unlocked=recruits.filter(r=>r.stage<=state.phase).length;
  document.getElementById('scenario-status').textContent=`Guilda ${state.guild} · aliança ${state.route}. Base completa: 2 abertos, 2 pretos, 1 vermelho. ${unlocked} de 5 já liberados na cronologia; ${count} ${count===1?'aliado':'aliados'} no grupo (+${count} no D20). ${closed?'Convites encerrados.':'Convites ainda podem ser simulados.'}`;
  document.getElementById('free-team').disabled=closed;
  document.getElementById('clear-team').disabled=closed;
  renderConsequences();
}
function renderConsequences() {
  const rejected=['A','B','C'].filter(g=>g!==state.guild), other=state.route==='X'?'Y':'X', rivals=opponents();
  const lanes=[
    ['Compromisso com a Guilda '+state.guild,'Arco 1 · primeira guilda rejeitada','Partida 1 · Guilda '+rejected[0],'O confronto anterior volta como rivalidade.'],
    ['Compromisso com a Guilda '+state.guild,'Arco 1 · segunda guilda rejeitada','Partida 2 · Guilda '+rejected[1],'Outro modo de interpretar o mesmo compromisso.'],
    ['Aliança com o grupo '+state.route,'Arco 2 · grupo preterido: '+other,'Quartas · Grupo '+other,'Ele seguiu seu próprio caminho até o torneio.'],
    ['Quem ficou fora do grupo','R1–R5 · um integrante por par','Semifinal · '+rivals.map((h,i)=>'R'+(i+1)+h).join(', '),'Desfechos e ausência de recrutamento mudam os rostos.'],
    ['Chefão preparado nos arcos anteriores','Presença fixa · guilda e rota mudam o contexto','Final · Chefão fixo do torneio','U/V converge aqui. A identidade do adversário não varia.']
  ];
  document.getElementById('echo-status').textContent=`Cenário: Guilda ${state.guild}, aliança ${state.route}. Os reencontros abaixo usam os aliados escolhidos no slide 6. Antes do fechamento, a semifinal é uma projeção.`;
  document.getElementById('echo-lanes').innerHTML=lanes.map(l=>`<div class="cause-lane"><div class="cause"><strong>${l[0]}</strong><small>${l[1]}</small></div>${arrow}<div class="effect"><strong>${l[2]}</strong><small>${l[3]}</small></div></div>`).join('');
  const matches=[['1','Guilda '+rejected[0],'O compromisso de Ghork e as relações construídas antes de escolher.'],['2','Guilda '+rejected[1],'Uma reação diferente à rejeição, mantendo a hostilidade.'],['3 · Quartas','Grupo '+other,'O grupo preterido em X/Y chegou até aqui sem Ghork.'],['4 · Semifinal','Um herói de cada par','O que Ghork fez, deixou de fazer ou nunca chegou a conhecer.'],['5 · Final','Chefão fixo do torneio','A preparação anterior e a postura U/V, após a semifinal.']];
  document.getElementById('matches').innerHTML=matches.map(m=>`<tr><td>${m[0]}</td><td data-label="Adversário">${m[1]}</td><td data-label="Reconhecimento">${m[2]}</td></tr>`).join('');
  document.getElementById('matches-caption').textContent=`Reta final · Guilda ${state.guild} / aliança ${state.route}`;
  document.getElementById('roster').innerHTML=rivals.map((h,i)=>`<li><strong>R${i+1} · ${h}</strong><small>${state.heroes[i]==='none'?'Sorteado: ninguém deste par foi recrutado.':'Ghork recrutou '+state.heroes[i]+'. O outro integrante enfrenta seu grupo.'}</small></li>`).join('');
  const draws=state.heroes.filter(h=>h==='none').length;
  document.getElementById('roster-status').textContent=`Cinco adversários; ${5-draws} definidos pelos aliados recrutados e ${draws} por sorteio. ${state.phase===4?'Composição após o fechamento.':'Projeção: recrutamentos ainda podem alterar a composição.'}`;
  document.getElementById('reroll').disabled=draws===0;
}

const deck=document.getElementById('deck');
deck.innerHTML=slides.map((s,i)=>`<section class="slide" id="slide-${i+1}" aria-label="Slide ${i+1}: ${s.title}" tabindex="-1" hidden>${s.content}</section>`).join('');
const index=document.getElementById('slide-index');
index.innerHTML=slides.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join('');
let current=0;
function drawFlows() {
  document.querySelectorAll('.slide:not([hidden]) .flow').forEach(el=>{
    const graph=graphs.get(el.dataset.flow), rect=el.getBoundingClientRect(), svg=el.querySelector('svg');
    const marker='arrow-'+el.dataset.flow;
    svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
    svg.innerHTML=`<defs><marker id="${marker}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z"/></marker></defs>`+graph.edges.map(e=>{
      const a=el.querySelector(`[data-node="${e.from}"]`).getBoundingClientRect(), b=el.querySelector(`[data-node="${e.to}"]`).getBoundingClientRect();
      const x1=a.left+a.width/2-rect.left,y1=a.bottom-rect.top,x2=b.left+b.width/2-rect.left,y2=b.top-rect.top,mid=(y1+y2)/2;
      return `<path class="${e.optional?'optional':''}" d="M${x1} ${y1}V${mid}H${x2}V${y2}" marker-end="url(#${marker})"/>`;
    }).join('');
  });
}
function showSlide(n, focus=true) {
  current=Math.max(0,Math.min(slides.length-1,n));
  document.querySelectorAll('.slide').forEach((el,i)=>el.hidden=i!==current);
  index.value=String(current);
  document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;
  document.getElementById('prev').disabled=current===0;
  document.getElementById('next').disabled=current===slides.length-1;
  history.replaceState(null,'','#slide-'+(current+1));
  if(focus){document.getElementById('slide-'+(current+1)).focus({preventScroll:true});window.scrollTo(0,0);}
  requestAnimationFrame(drawFlows);
}
function fromHash(){const match=location.hash.match(/^#slide-(\d+)$/);return match?Number(match[1])-1:0;}
document.querySelector('nav').hidden=false;
index.addEventListener('change',()=>showSlide(Number(index.value)));
document.getElementById('prev').addEventListener('click',()=>showSlide(current-1));
document.getElementById('next').addEventListener('click',()=>showSlide(current+1));
document.addEventListener('keydown',event=>{
  if(event.target.closest('input,select,textarea,button,summary,a') || event.altKey || event.ctrlKey || event.metaKey) return;
  const target={ArrowRight:current+1,ArrowLeft:current-1,Home:0,End:slides.length-1}[event.key];
  if(target!==undefined){event.preventDefault();showSlide(target);}
});
document.querySelectorAll('[data-jump]').forEach(button=>button.addEventListener('click',()=>showSlide(Number(button.dataset.jump)-1)));
for(const field of ['guild','route']) document.getElementById(field).addEventListener('change',event=>{state[field]=event.target.value;resetScenario();renderScenario();});
document.getElementById('phase').addEventListener('change',event=>{state.phase=Number(event.target.value);renderScenario();});
document.querySelectorAll('[data-history]').forEach(select=>select.addEventListener('change',()=>{const i=Number(select.dataset.history);state.history[i]=select.value;state.heroes[i]='none';renderScenario();}));
document.querySelectorAll('[data-paid]').forEach(input=>input.addEventListener('change',()=>{state.paid[Number(input.dataset.paid)]=input.checked;renderScenario();}));
document.querySelectorAll('[data-hero]').forEach(select=>select.addEventListener('change',()=>{state.heroes[Number(select.dataset.hero)]=select.value;renderScenario();}));
document.getElementById('free-team').addEventListener('click',()=>{
  resetScenario();
  getCodes().forEach((code,i)=>{if(code!=='R' && recruits[i].stage<=state.phase){const hero=code==='PA'?'B':'A';state.history[i]=hero;state.heroes[i]=hero;}});
  renderScenario();
});
document.getElementById('clear-team').addEventListener('click',()=>{resetScenario();renderScenario();});
document.getElementById('reroll').addEventListener('click',()=>{state.draw=state.draw.map((value,i)=>state.heroes[i]==='none'?(Math.random()<.5?'A':'B'):value);renderConsequences();});
window.addEventListener('hashchange',()=>showSlide(fromHash()));
window.addEventListener('resize',()=>requestAnimationFrame(drawFlows));
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.slide').forEach(el=>el.hidden=false);drawFlows();});
window.addEventListener('afterprint',()=>showSlide(current,false));
renderScenario();showSlide(fromHash(),false);
</script>
</body>
