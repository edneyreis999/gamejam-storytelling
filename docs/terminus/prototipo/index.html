<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Terminus V2: campanha completa em visual novel e catálogo de produção de arte."
    />
    <title>Terminus V2 — roteiro e direção de arte</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="content.js"></script>
    <script defer src="supplementary.js"></script>
    <script defer src="art-authority.js"></script>
    <script defer src="art.js"></script>
    <script defer src="staging.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="catalog.js"></script>
    <script defer src="stage-view.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Ir para o conteúdo</a>
    <header class="masthead">
      <a href="index.html" class="wordmark"
        >TERMINUS<span>A história de Ghork</span></a
      ><span class="edition">V2 · em desenvolvimento</span>
    </header>
    <nav id="workspace-nav" aria-label="Jogo e produção">
      <button type="button" data-view="play">Jogar</button
      ><button type="button" data-view="scenes">Cenas e variantes</button
      ><button type="button" data-view="catalog">Inventário de arte</button
      ><button type="button" data-view="review">Como usar</button>
      <label
        ><input id="art-mode" type="checkbox" checked /> Direção de arte</label
      >
      <label
        ><input id="reduce-motion" type="checkbox" /> Reduzir movimento</label
      >
    </nav>
    <nav id="toolbar" aria-label="Controles da partida"></nav>
    <div id="stats" class="statusbar"></div>
    <p id="notice" role="status" class="notice" hidden></p>
    <main id="main" tabindex="-1"></main>
    <footer>
      <span
        >Roteiro e arte em desenvolvimento · nenhuma silhueta é arte
        final.</span
      ><button id="review-button" type="button" class="text-button">
        Sobre esta versão
      </button>
    </footer>
    <dialog id="modal" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="actions"></div>
    </dialog>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
      aria-label="Importar partida V2"
    />
    <noscript
      ><p>
        Ative JavaScript para jogar e consultar o inventário. Nenhuma conexão
        externa é necessária.
      </p></noscript
    >
  </body>
</html>
